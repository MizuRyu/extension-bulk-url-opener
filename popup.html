<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bulk URL Opener</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="card">
    <h1 data-i18n="appTitle">Bulk URL Opener</h1>
    <form id="url-form">
      <label for="url-input" class="input-label">
        <span data-i18n="inputLabel">URLs to open</span>
        <span id="url-count" class="count" aria-live="polite"></span>
      </label>
      <textarea id="url-input" placeholder="Enter one URL per line or separate with commas" data-i18n="urlPlaceholder"
        data-i18n-attr="placeholder" rows="6"></textarea>
      <p class="hint" data-i18n="inputHint">Only http/https URLs are opened; we recommend batching no more than 30 at a time.</p>
      <button type="submit" class="primary" data-i18n="submitButton">Open URLs</button>
      <button type="button" id="clear" class="ghost" data-i18n="clearButton">Clear</button>
    </form>
    <div id="status" role="status" aria-live="polite" class="status"></div>
  </main>
  <script src="popup.js" defer></script>
</body>

</html>
